version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/devcheck
    ldflags:
      - -s -w -X github.com/ilyas-bkgo/devcheck/internal/version.Version={{ .Version }} -X github.com/ilyas-bkgo/devcheck/internal/version.Commit={{ .Commit }} -X github.com/ilyas-bkgo/devcheck/internal/version.Date={{ .Date }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
